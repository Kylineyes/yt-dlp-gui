[package]
name = "yt-dlp-gui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17.1", features = ["raw-window-handle-06"] }
tokio = { version = "1.43", features = ["io-util", "process", "rt-multi-thread", "sync"] }
ytd-rs = "0.2.1"

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
