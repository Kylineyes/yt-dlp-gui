[package]
name = "yt-dlp-gui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
rfd = "0.15"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.17.1"
tokio = { version = "1.43", features = ["io-util", "process", "rt-multi-thread", "sync"] }
ytd-rs = "0.2.1"

[build-dependencies]
slint-build = "1.17.1"
