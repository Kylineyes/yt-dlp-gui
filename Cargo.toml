[package]
name = "yt-dlp-gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.10"

[build-dependencies]
slint-build = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[workspace]
resolver = "2"
